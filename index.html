<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frasco-Mágico-de-Deseos-K.M.R</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dedicatoria">Un frasco lleno de deseos...</div>
    <div class="luna-dinamica"></div>

    <div class="escenario-frasco">
        <div class="soporte-brillante"></div>

        <div class="contenedor-frasco" id="frasco" onclick="liberarMagia()">
            <div class="corcho"></div>
            <div class="cuello"></div>
            <div class="cuerpo-frasco" id="interiorFrasco"></div>
        </div>
    </div>

    <button class="control-musica" id="btnMusica" onclick="toggleMusica()">✨ Encender la Magia</button>

    <!-- Reproductor de Audio -->
    <audio id="musica" loop>
        <source src="https://misleading-red-zaozz68z.edgeone.app/La%20Oreja%20de%20Van%20Gogh%20-%20Rosas%20(Letra_Lyrics)(MP3_160K).mp3" type="audio/mpeg">
    </audio>

    <!-- Enlace al archivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
